<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengatur Jam Kerja</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:430px;
    background:#fff;
    border-radius:22px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

h1{
    text-align:center;
    color:#0f172a;
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    font-size:14px;
    margin-bottom:28px;
}

label{
    display:block;
    margin-top:18px;
    margin-bottom:8px;
    color:#334155;
    font-weight:600;
}

input[type=time],
input[type=number]{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:2px solid #dbeafe;
    background:#f8fafc;
    font-size:20px;
    transition:.2s;
}

input:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 5px rgba(37,99,235,.15);
}

.result{
    margin-top:28px;
    display:grid;
    gap:15px;
}

.box{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:16px;
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:.2s;
}

.box:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.title{
    color:#64748b;
    font-size:15px;
}

.time{
    font-size:28px;
    font-weight:700;
    color:#2563eb;
    letter-spacing:1px;
}

.footer{
    margin-top:25px;
    text-align:center;
    color:#94a3b8;
    font-size:13px;
}
</style>
</head>

<body>

<div class="card">

<h1>🕒 Pengatur Jam Kerja</h1>

<p class="subtitle">
Hitung waktu berangkat dan persiapan secara otomatis
</p>

<label>Jam Kerja</label>
<input type="time" id="jamKerja">

<label>🚗 Berangkat Sebelum Kerja (menit)</label>
<input
type="number"
id="sebelumKerja"
value="30"
min="0"
step="1">

<label>⏰ Persiapan Sebelum Berangkat (menit)</label>
<input
type="number"
id="sebelumBerangkat"
value="60"
min="0"
step="1">

<div class="result">

<div class="box">
<div class="title">
🚗 Berangkat Kerja
</div>
<div class="time" id="jamBerangkat">
--:--
</div>
</div>

<div class="box">
<div class="title">
⏰ Persiapan
</div>
<div class="time" id="jamPersiapan">
--:--
</div>
</div>

</div>

<div class="footer">
Jam akan dihitung otomatis setiap kali Anda mengubah salah satu nilai.
</div>

</div>

<script>

const jamKerja=document.getElementById("jamKerja");
const sebelumKerja=document.getElementById("sebelumKerja");
const sebelumBerangkat=document.getElementById("sebelumBerangkat");

const jamBerangkat=document.getElementById("jamBerangkat");
const jamPersiapan=document.getElementById("jamPersiapan");

jamKerja.addEventListener("input",hitung);
sebelumKerja.addEventListener("input",hitung);
sebelumBerangkat.addEventListener("input",hitung);

function hitung(){

    if(jamKerja.value===""){
        jamBerangkat.textContent="--:--";
        jamPersiapan.textContent="--:--";
        return;
    }

    let [jam,menit]=jamKerja.value.split(":").map(Number);

    let total=jam*60+menit;

    let menitSebelumKerja=Number(sebelumKerja.value)||0;
    let menitPersiapan=Number(sebelumBerangkat.value)||0;

    let waktuBerangkat=(total-menitSebelumKerja+1440)%1440;

    let waktuPersiapan=(waktuBerangkat-menitPersiapan+1440)%1440;

    jamBerangkat.textContent=formatJam(waktuBerangkat);
    jamPersiapan.textContent=formatJam(waktuPersiapan);
}

function formatJam(total){

    let jam=Math.floor(total/60);
    let menit=total%60;

    return String(jam).padStart(2,"0")+":"+
           String(menit).padStart(2,"0");
}

</script>

</body>
</html>
